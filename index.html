:root{
  --primary:#7B1FA2;--primary-d:#4A148C;--primary-l:#F3E5F5;--pink:#F8BBD0;
  --ok:#43A047;--bad:#E53935;--warn:#FFB300;--sky:#29B6F6;
  --bg:#FAF5FC;--card:#fff;--ink:#1F2937;--muted:#6b7280;--line:#F8BBD0;--shadow:rgba(0,0,0,.14);
  --sky1:#7FD0FF;--sky2:#D9F2FF;--sky3:#FFF8D6;
  --f-letters:#7B1FA2;--f-words:#1E88E5;--f-grammar:#00897B;--f-islamic:#2E7D32;--f-observe:#F57C00;--f-projects:#D81B60;--f-integration:#5E35B1;--f-stories:#C2185B;--f-writing:#AD1457;
  --fs:1;
}
:root[data-theme=dark]{
  --primary:#CE93D8;--primary-d:#E1BEE7;--primary-l:#2a1733;--pink:#6a3a7a;
  --bg:#150f1b;--card:#211829;--ink:#f3eaf7;--muted:#a99bb5;--line:#5b3a6b;--shadow:rgba(0,0,0,.6);
  --sky1:#1b2a52;--sky2:#2b1f4a;--sky3:#3a2a4f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px*var(--fs))}
body{margin:0;font-family:'Tajawal','Segoe UI','Noto Sans Arabic','Noto Naskh Arabic',Tahoma,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.6;overscroll-behavior-y:contain}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
#app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
body.skymode{background:linear-gradient(180deg,var(--sky1),var(--sky2) 55%,var(--sky3)) fixed}
.sky{min-height:100vh}
.pad{padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.center{text-align:center}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* header & top bars */
.topbar{display:flex;align-items:center;gap:8px;padding:10px 12px;color:#fff;font-weight:900;font-size:1.15rem}
.topbar .ttl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.iconbtn{background:rgba(255,255,255,.22);border:0;border-radius:14px;width:44px;height:44px;color:#fff;font-size:1.3rem;display:grid;place-items:center}
.iconbtn:active{transform:scale(.94)}
.logo{font-size:2.1rem;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.35);margin:0}
.tag{color:#fff;font-weight:700;font-size:.9rem;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.rainbow{height:6px;border-radius:3px;background:linear-gradient(90deg,#FF9A9E,#FECFEF,#A1C4FD,#C2E9FB,#D4FC79,#96E6A1);margin:10px 0}
.pill{background:rgba(255,255,255,.88);color:var(--primary-d);border-radius:20px;padding:4px 14px;font-weight:900;display:inline-flex;gap:6px;align-items:center}
:root[data-theme=dark] .pill{background:rgba(33,24,41,.9)}

/* cards */
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 3px 8px var(--shadow)}
.unit{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:20px;padding:14px;color:#fff;text-align:start;margin-bottom:10px;box-shadow:0 4px 8px var(--shadow);transition:transform .12s}
.unit:active{transform:scale(.985)}
.unit .ic{font-size:2.4rem}
.unit .nm{font-weight:900;font-size:1.1rem}
.unit .sub{font-size:.85rem;font-weight:700;opacity:.95}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.3);overflow:hidden;margin:6px 0 3px}
.bar>i{display:block;height:100%;background:#fff;border-radius:6px;transition:width .4s}
.bigbtn{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-radius:20px;padding:16px;color:#fff;font-weight:900;font-size:1.1rem;margin-bottom:10px;box-shadow:0 4px 8px var(--shadow);text-align:start}
.bigbtn small{display:block;font-weight:700;opacity:.9;font-size:.85rem}
.goal{background:rgba(255,255,255,.88);color:var(--primary-d);border-radius:16px;padding:8px 14px;margin:8px 0;font-weight:900}
:root[data-theme=dark] .goal{background:rgba(33,24,41,.9)}
.goal .bar{background:var(--primary-l)}
.goal .bar>i{background:var(--warn)}

/* exercise */
.xbody{flex:1;padding:8px 16px 28px}
.progress{height:8px;background:rgba(0,0,0,.08)}
.progress>i{display:block;height:100%;transition:width .3s}
.meta{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 0;font-weight:900;color:var(--primary)}
.q{font-size:1.5rem;font-weight:700;line-height:1.9;margin:0}
.qvis{font-size:2rem;line-height:1.6;text-align:center;white-space:pre-line;border-top:2px dashed var(--line);margin-top:10px;padding-top:10px;direction:ltr}
.spk{border:0;background:var(--primary-l);color:var(--primary);border-radius:12px;width:40px;height:40px;font-size:1.2rem;float:left;margin-inline-start:8px}
.wbox{margin-top:14px}
.fb{margin-top:14px;padding:12px;border-radius:14px;font-weight:900;font-size:1.1rem;text-align:center}
.fb.good{background:rgba(67,160,71,.18)}
.fb.try{background:rgba(255,179,0,.2)}
.bottom{display:flex;align-items:center;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%)}
.btn{background:var(--primary);color:#fff;border:0;border-radius:18px;padding:12px 22px;font-weight:900;font-size:1.05rem;min-height:50px;box-shadow:0 3px 6px var(--shadow)}
.btn:disabled{background:#bbb;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--primary);box-shadow:none;border:2px solid var(--primary)}
.btn.warn{background:var(--bad)}
.chk{width:100%;margin-top:14px}
.hintbtn{background:none;border:0;font-size:2rem;line-height:1}
.linkbtn{background:none;border:0;color:var(--primary);font-weight:900;padding:8px}

/* widgets */
.choices{display:grid;gap:10px}
.choice{background:var(--sky);color:#fff;border:0;border-radius:20px;padding:16px;font-weight:900;font-size:1.35rem;box-shadow:0 3px 6px var(--shadow)}
.choice.big{font-size:2.1rem;padding:10px}
.choice.ok{background:var(--ok)}.choice.bad{background:#9e9e9e}
.patrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.pcell{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:8px 12px;font-size:2rem}
.pcell.q{border-color:var(--warn);font-weight:900}
.frow{display:flex;align-items:center;gap:12px;margin:8px 0}
.flabel{flex:1;font-size:1.25rem;font-weight:700}
input.num{width:92px;border:3px solid var(--line);border-radius:14px;background:var(--card);text-align:center;font-size:1.8rem;font-weight:900;padding:6px;direction:ltr}
input.num:focus{border-color:var(--primary);outline:none}
input.num.ok{border-color:var(--ok);background:rgba(67,160,71,.12)}
input.num.bad{border-color:var(--bad);background:rgba(229,57,53,.1)}
.seqrow,.eqrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:10px 0;direction:ltr}
.scell{min-width:64px;background:var(--primary-l);border:3px solid var(--line);border-radius:14px;text-align:center;padding:8px;font-size:1.8rem;font-weight:900}
.seqrow input.num,.eqrow input.num{width:72px}
.eqn{font-size:1.9rem;font-weight:900}.eqop{font-size:1.8rem;font-weight:900}
.tapwrap{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tapitem{position:relative;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:12px;font-size:1.9rem;min-width:64px}
.tapitem.sel{background:rgba(255,179,0,.3);border-color:var(--warn)}
.tapitem.crossed::after{content:'❌';position:absolute;inset:0;display:grid;place-items:center;font-size:1.9rem}
.tapitem.right{background:rgba(67,160,71,.25);border-color:var(--ok)}
.ordlab{font-weight:900;margin-top:8px}
.ordbox,.ordpool{display:flex;flex-wrap:wrap;gap:8px;padding:8px;border-radius:16px;min-height:62px}
.ordbox{background:var(--primary-l)}
.chip{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:10px 14px;font-size:1.2rem;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.chip.placed{background:rgba(67,160,71,.2);border-color:var(--ok)}
.chip b{background:var(--ok);color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.85rem}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mtile{display:block;width:100%;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:12px;font-size:1.35rem;font-weight:700;margin:6px 0;text-align:center}
.mtile.sel{background:rgba(255,179,0,.3);border-color:var(--warn)}
.mtile.done{background:rgba(67,160,71,.25);border-color:var(--ok)}
.buildbox{min-height:110px;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:2rem;direction:ltr}
.stepper{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:12px}
.stepper button{width:58px;height:58px;border-radius:50%;border:0;background:var(--primary);color:#fff;font-size:2rem;font-weight:900}
.stepper button:disabled{background:#bbb}
.stepper output{font-size:2.8rem;font-weight:900;color:var(--primary);min-width:70px;text-align:center}
table.grid{border-collapse:separate;border-spacing:3px;margin:0 auto;direction:ltr}
table.grid th{font-weight:900;width:34px;height:34px}
table.grid td button{width:44px;height:44px;border:2px solid var(--line);border-radius:8px;background:var(--card);font-size:1.6rem;padding:0}
.gridnote{font-size:.8rem;color:var(--muted);text-align:center;margin-top:6px}
.pcells{display:grid;gap:3px;margin:0 auto;width:max-content;direction:ltr}
.pcells button,.pcells span{width:56px;height:56px;border:2px solid var(--line);border-radius:8px;background:var(--card);font-size:1.6rem;display:grid;place-items:center;padding:0}
.pcells .vis{background:#FFF59D;color:#333}.pcells .cur{background:rgba(255,179,0,.5);border-color:var(--warn)}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:6px;justify-content:center;margin:12px auto 0;direction:ltr}
.dpad button{border:0;border-radius:50%;background:var(--primary);color:#fff;font-size:1.6rem}
.paintg{display:grid;gap:3px;margin:6px auto;width:max-content;direction:ltr}
.paintg button,.paintg span{width:var(--c,38px);height:var(--c,38px);border:1px solid #bbb;border-radius:5px;background:#fff;padding:0}
.paintg .on{background:var(--primary)}
.coins{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.coin{width:74px;height:74px;border-radius:50%;border:3px solid #FF8F00;background:radial-gradient(#FFE082,#FFB300);color:#4e342e;font-size:1.5rem;font-weight:900;box-shadow:0 3px 6px var(--shadow)}
.coinsum{font-size:1.4rem;font-weight:900;text-align:center;margin:8px 0}
.tray{min-height:70px;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;direction:ltr;justify-content:center;align-items:center}
.tray .coinchip{background:#FFE082;border-radius:20px;padding:4px 14px;font-weight:900}
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.memcard{aspect-ratio:1;border:3px solid var(--line);border-radius:14px;background:var(--primary);color:#fff;font-size:1.6rem;font-weight:900;display:grid;place-items:center;padding:2px;overflow:hidden;transition:transform .2s}
.memcard.up{background:var(--card);color:var(--ink)}
.memcard.ok{background:rgba(67,160,71,.25);border-color:var(--ok);color:var(--ink)}
.conn{position:relative;margin:0 auto;background:var(--card);border:3px solid var(--line);border-radius:16px;direction:ltr}
.conn svg{position:absolute;inset:0;pointer-events:none}
.conn button{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:18px;min-width:34px;min-height:34px;padding:2px 8px;font-weight:900;color:#fff;background:rgba(150,150,150,.25)}
.conn button.pt{background:var(--warn);box-shadow:0 2px 4px var(--shadow)}
.conn button.pt.hit{background:var(--ok)}
.clockwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.digital{font-size:2.4rem;font-weight:900;color:var(--primary);direction:ltr}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.cchip{border:2px solid var(--primary);background:var(--card);color:var(--primary);border-radius:20px;padding:6px 16px;font-weight:900}
.cchip.on{background:var(--primary);color:#fff}
.round{width:48px;height:48px;border-radius:50%;border:0;background:var(--primary);color:#fff;font-size:1.6rem;font-weight:900}
.zone{background:var(--card);border:3px solid var(--sky);border-radius:16px;padding:8px;margin-top:10px;min-height:84px;text-align:center;width:100%}
.zone.armed{border-color:var(--warn)}
.zone h4{margin:0 0 4px}
.pool{background:var(--primary-l);border-radius:16px;padding:6px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:62px}
.pool .chip,.zone .chip{font-size:1.5rem;font-weight:900}
.chip.sel{background:rgba(255,179,0,.3);border-color:var(--warn)}

/* results, rewards */
.stars3{display:flex;justify-content:center;gap:6px;font-size:3.4rem}
.stars3 span{animation:pop .6s both}
.stars3 span:nth-child(2){animation-delay:.2s}.stars3 span:nth-child(3){animation-delay:.4s}
@keyframes pop{from{transform:scale(0) rotate(-60deg)}60%{transform:scale(1.3)}to{transform:scale(1)}}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.sticker{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.sticker.locked{opacity:.55;background:#ececec}
:root[data-theme=dark] .sticker.locked{background:#2b2233}
.sticker .e{font-size:3rem}
.sticker.new{animation:pop .7s both}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* settings, tables */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:900}
.switch{position:relative;width:54px;height:30px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;background:#bbb;border-radius:20px;transition:.2s}
.switch i::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+i{background:var(--primary)}
.switch input:checked+i::after{inset-inline-start:27px}
.field{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;min-width:0}
table.t{width:100%;border-collapse:collapse}
table.t th,table.t td{padding:8px;border-bottom:1px solid var(--line);text-align:start}
.h2{font-size:1.3rem;font-weight:900;margin:18px 0 6px;color:var(--primary)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-weight:700;z-index:60;max-width:90vw;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:70;padding:20px}
.modal .card{max-width:420px;width:100%}
.modal .row{justify-content:flex-end;margin-top:14px}

/* speed + studio */
.speedq{font-size:3.2rem;font-weight:900;text-align:center;direction:ltr;margin:14px 0}
.timer{height:12px;background:var(--primary-l);border-radius:8px;overflow:hidden}
.timer>i{display:block;height:100%;background:var(--warn);transition:width 1s linear}
.studio canvas{width:100%;height:min(58vh,520px);background:#fff;border:3px solid var(--line);border-radius:16px;touch-action:none;display:block}
.swatches{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 3px var(--shadow)}
.sw.on{border-color:#000}

/* certificate */
.cert{background:#fffdf5;color:#3b2a00;border:10px double #c9a227;border-radius:12px;padding:28px 16px;text-align:center}
.cert h1{font-size:2.2rem;margin:0 0 6px;color:#7B1FA2}
.cert .nm{font-size:2rem;font-weight:900;margin:14px 0;border-bottom:2px dashed #c9a227;display:inline-block;padding:0 24px}
@media print{
  body{background:#fff}
  .noprint,.topbar,.bottom,.toast{display:none!important}
  .sky{background:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.q{font-size:1.3rem}.choice{font-size:1.15rem}table.grid td button{width:38px;height:38px}}

/* ---- v3 ---- */
.starslive{transition:transform .2s}.starslive.pop{animation:pop .5s both}
.petem{font-size:1.6rem;display:inline-block}.petem.sm{font-size:1.8rem}.petem.hop{animation:hop .6s 2}
@keyframes hop{50%{transform:translateY(-10px)}}
.quests .qrow{display:flex;gap:8px;align-items:center;padding:6px 0;font-weight:700;border-bottom:1px dashed var(--line)}.quests .qrow.done{opacity:.7;text-decoration:line-through}
.unit.lockedu{filter:grayscale(.8);opacity:.75}
.bottom{flex-wrap:wrap}
.mapsvg{width:100%;height:auto;display:block}.mapme{animation:hop 1.4s infinite}
.unilist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.uchip{background:var(--primary-l);color:var(--primary-d);border-radius:14px;padding:3px 10px;font-size:.85rem;font-weight:700;opacity:.6}.uchip.on{opacity:1;background:#C8E6C9;color:#1B5E20}
.petbtn{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:8px 14px;display:flex;flex-direction:column;align-items:center;font-weight:900;color:inherit}
.petbtn.on{border-color:var(--primary);background:var(--primary-l)}.petbtn:disabled{opacity:.5}
.nlwrap{background:var(--card);border-radius:14px;padding:6px;margin:6px 0;overflow-x:auto}.nline{width:100%;min-width:480px;height:auto;color:var(--ink,#222)}
.hop{animation:fadein .5s both}@keyframes fadein{from{opacity:0}}
.helpm .card{max-height:90vh;overflow:auto}
.statrow{flex-wrap:wrap;margin:10px 0}.stat{flex:1;min-width:70px;text-align:center;padding:8px}.stat b{display:block;font-size:1.4rem;color:var(--primary)}.stat small{color:var(--muted,#666)}
.bars{display:flex;gap:6px;align-items:flex-end;justify-content:space-between;height:150px}.barcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;font-size:.8rem}
.bcol{width:70%;background:var(--primary);border-radius:6px 6px 0 0}.bv{font-weight:900}
.skrow{display:flex;gap:8px;align-items:center;padding:4px 0}.skrow span{width:110px;font-weight:700}.skrow .bar{flex:1}
.sheet{background:#fff;color:#000;border:2px solid var(--line);border-radius:12px;padding:18px;margin-top:12px}
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 24px}.sitem{display:flex;gap:8px;font-size:1.4rem;font-weight:700;padding:6px 0;border-bottom:1px dotted #999}.sn{color:#777;font-size:1rem}
.qrbox{display:inline-block;background:#fff;padding:6px;border-radius:12px}.qrbox svg{max-width:100%;height:auto}
html.calm #app{filter:saturate(.55)}html.calm *{animation:none!important;transition:none!important}
html.calm body.skymode{background:linear-gradient(#cfd8dc,#eceff1) fixed}
html.easy body,html.easy button,html.easy input,html.easy select,html.easy textarea{font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;letter-spacing:.03em;word-spacing:.2em;line-height:1.9}
html.easy *{font-weight:700!important}
@media print{.sheet{border:0;padding:0}.sgrid{gap:22px 30px}.sitem{font-size:1.6rem}.app-print-hide{display:none}}

/* ---- classroom (Arabic book) ---- */
.qvis{direction:rtl}.qvis.big{font-size:4rem;font-weight:900;line-height:1.5}
.teacher{display:flex;gap:10px;align-items:flex-start}
.teacher .av{font-size:2.4rem;line-height:1;flex:none}
.bubble{position:relative;background:var(--primary-l);border-radius:6px 18px 18px 18px;padding:8px 12px;font-weight:700;font-size:1.25rem;line-height:1.9;flex:1}
.sec{display:inline-block;background:var(--primary);color:#fff;border-radius:12px;padding:1px 12px;font-size:.85rem;font-weight:900;margin-bottom:6px}
.scene{font-size:3.2rem;text-align:center;letter-spacing:.2em;margin:8px 0 2px}
.board{background:#2f5d3a;color:#fff;border:6px solid #8d6e4b;border-radius:14px;padding:12px 14px;font-size:1.9rem;line-height:2.2;text-align:center;font-weight:700;box-shadow:inset 0 0 14px rgba(0,0,0,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.chip{border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:6px 14px;font-size:1.6rem;font-weight:700;min-height:48px;box-shadow:0 2px 4px var(--shadow)}
.chip.on{border-color:var(--primary);background:var(--primary-l)}.chip.seen{border-color:var(--ok);background:rgba(67,160,71,.14)}
.chip.ok{border-color:var(--ok);background:rgba(67,160,71,.25)}.chip.bad{border-color:var(--bad);background:rgba(229,57,53,.2)}
.chip.sm{font-size:1.15rem;padding:2px 10px;min-height:36px}.chip.lg{font-size:2.2rem;padding:8px 18px}.chip.hl{background:#FFE082;border-color:var(--warn)}
.row3{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.answer{min-height:70px;border-bottom:4px double var(--primary);display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;padding:8px;background:repeating-linear-gradient(transparent,transparent 38px,rgba(123,31,162,.12) 39px)}
.answer .word{font-size:2rem;font-weight:700;letter-spacing:0}
.findline{font-size:2.2rem;line-height:2.4;text-align:center;font-weight:700;padding:8px}
.findline .g{cursor:pointer;border-radius:6px}.findline .g.on{background:#FFE082;box-shadow:0 0 0 2px var(--warn)}.findline .g.ok{background:rgba(67,160,71,.35)}.findline .g.bad{background:rgba(229,57,53,.3)}
.tracewrap{display:flex;flex-direction:column;align-items:center;gap:8px}
canvas.trace{width:100%;max-width:340px;height:300px;background:#fff;border:3px solid var(--line);border-radius:16px;touch-action:none;background-image:repeating-linear-gradient(transparent,transparent 99px,rgba(33,150,243,.35) 100px)}
.forms{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.forms .chip{font-size:2rem;min-width:62px}
.forms small{display:block;font-size:.7rem;color:var(--muted);font-weight:700}
.kb{margin-top:10px;direction:rtl;user-select:none}.kb .kr{display:flex;gap:4px;justify-content:center;margin-bottom:5px}
.kb button{flex:1;min-width:0;max-width:44px;height:46px;border:0;border-radius:10px;background:var(--primary-l);color:var(--primary-d);font-weight:900;font-size:1.3rem;box-shadow:0 2px 3px var(--shadow)}
.kb button.wide{max-width:120px;flex:3}.kb button.act{background:var(--primary);color:#fff}
.typed{min-height:64px;border:3px solid var(--line);border-radius:14px;background:var(--card);font-size:2rem;font-weight:700;padding:6px 12px;display:flex;align-items:center;flex-wrap:wrap;direction:rtl}
.typed.ok{border-color:var(--ok);background:rgba(67,160,71,.15)}.typed.bad{border-color:var(--bad)}
.notebook{background:repeating-linear-gradient(#fff,#fff 43px,#90CAF9 44px);border:2px solid var(--line);border-left:4px solid #E57373;border-radius:12px;padding:6px 12px;font-size:2rem;line-height:44px;text-align:center;color:#1F2937;font-weight:700}
:root[data-theme=dark] .notebook{background:repeating-linear-gradient(#2b2233,#2b2233 43px,#4a5d7a 44px);color:#f3eaf7}
.checkl{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px dashed var(--line);font-weight:700;font-size:1.1rem}
.checkl input{width:26px;height:26px;accent-color:var(--primary)}
.linecard{display:block;width:100%;text-align:center;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:8px;font-size:1.5rem;font-weight:700;line-height:2;color:var(--ink)}
.linecard.seen{border-color:var(--ok)}.linecard.hl{background:#FFE082;border-color:var(--warn);color:#333}
.stage{font-weight:900;color:var(--primary);text-align:center;margin-bottom:6px}
.letgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px}
.letcell{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 2px;text-align:center;font-size:2.6rem;font-weight:900;color:var(--primary);position:relative}
.letcell.done{border-color:var(--ok);background:rgba(67,160,71,.12)}.letcell small{display:block;font-size:.7rem;color:var(--muted)}
.memorow{display:flex;align-items:center;gap:10px}.memorow .st{font-size:1.6rem}
.sheet .trline{font-size:3.4rem;color:#bbb;letter-spacing:.35em;border-bottom:2px solid #90CAF9;line-height:1.5;white-space:nowrap;overflow:hidden;font-weight:700}
.sheet .trline b{color:#000}
html.calm .board{background:#455a64}
.shake{animation:shk .35s}@keyframes shk{20%{transform:translateX(-8px)}60%{transform:translateX(8px)}}

.tabs{display:flex;gap:6px;margin:0 0 10px}.tabs button{flex:1;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 6px;font:inherit;font-weight:900;cursor:pointer}.tabs button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px dashed var(--primary);color:var(--primary);font-weight:900;padding:0 6px;margin:0 4px}
.critbox{margin:6px 0}.crit{padding:4px 8px;font-weight:700;color:var(--muted)}.crit.ok{color:var(--ok)}
.notebook.muted-note{font-size:1rem;color:var(--muted)}
.pav{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--card);font-size:1.6rem;flex:none}.pav.big{width:64px;height:64px;font-size:2.4rem;box-shadow:0 2px 8px var(--shadow)}
.prow{display:flex;gap:6px;align-items:center;margin-bottom:8px}.prow-main{flex:1;display:flex;gap:10px;align-items:center;text-align:start;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:10px;font:inherit;cursor:pointer}.prow.me .prow-main{border-color:var(--primary);box-shadow:0 0 0 3px rgba(123,31,162,.18)}.prow-main small{display:block;color:var(--muted)}
.iconbtn.sm{width:40px;height:40px}.chip-me{border:0;cursor:pointer;font:inherit;font-weight:900}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:8px;margin:10px 0}.pcol{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;max-width:120px;text-align:center}.pcol b{font-size:.95rem}.pcol.me b{color:var(--primary)}
.pstep{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:start center;padding-top:6px;font-size:1.6rem;background:linear-gradient(#FFD54F,#FFB300)}.pstep.r1{background:linear-gradient(#CFD8DC,#90A4AE)}.pstep.r2{background:linear-gradient(#FFAB91,#BF8F6B)}
.brow{display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px}.brow.me{background:rgba(123,31,162,.12);outline:2px solid var(--primary)}.brow .rk{width:28px;text-align:center;font-weight:900}.brow small{display:block;color:var(--muted);font-size:.78rem}.brow .sc{font-weight:900;color:var(--primary)}
.code{background:#263238;color:#c3e88d;padding:10px;border-radius:10px;overflow:auto;font-size:.8rem;white-space:pre-wrap}
</style>
</head>

class Session {
  constructor({key, title, list, field='numbers'}){
    Object.assign(this, {key, title, list, field, i:0, tries:0, score:0, sstars:0, skips:0, locked:false, revealed:false,
      finished:false, helped:false, last:null, fb:null, run:0, starsAtStart:S.stars});
  }
  get cur(){ return this.list[this.i]; }
  get isLast(){ return this.i >= this.list.length - 1; }
  get pct(){ return Math.floor(this.score * 100 / this.list.length); }
  get rating(){ const p = this.pct; return p >= 90 ? 3 : p >= 60 ? 2 : p >= 30 ? 1 : 0; }
  get newStickers(){ return newlyUnlocked(this.starsAtStart, S.stars); }
  submit(ok){
    if (this.locked || this.finished) return;
    if (ok){
      let earned = this.tries === 0 ? 3 : this.tries === 1 ? 2 : 1;
      if (this.helped) earned = 1;
      if (this.tries === 0 && !this.helped) this.score++;
      this.sstars += earned; this.locked = true; this.last = true; this.fb = PRAISE[this.i % PRAISE.length];
      Snd.play('correct'); record(this.cur.id, earned, this.tries === 0 && !this.helped, true, this.cur); if (this.key === 'review') questTick('review', 1);
    } else {
      this.tries++; Snd.play('wrong'); this.last = false;
      if (this.tries >= MAX_TRIES){
        this.locked = true; this.revealed = true; this.fb = '💡 الحل الصحيح: ' + solutionText(this.cur);
        record(this.cur.id, 0, false, false, this.cur);
      } else this.fb = this.tries === 2 && this.cur.hint ? `حاول مرة أخرى 🌈 تلميح: ${this.cur.hint}` : 'حاول مرة أخرى 🌈';
    }
  }
  goTo(i){ Object.assign(this, {i, helped:false, tries:0, locked:false, revealed:false, last:null, fb:null}); this.run++; }
  next(){ if (this.finished || !this.locked) return; this.isLast ? this.finish() : this.goTo(this.i + 1); }
  skip(){ if (this.finished || this.locked || this.skips >= MAX_SKIPS) return; this.skips++; this.isLast ? this.finish() : this.goTo(this.i + 1); }
  finish(){
    this.finished = true;
    if (!this.key.startsWith('practice') && this.pct > (S.best[this.key] ?? -1)) S.best[this.key] = this.pct;
    if (this.key === 'practice') questTick('practice', 1);

}

/* --- transfer code (text + QR) --- */
function makeCode(){
  const bits = f => { let hex = '', v = 0; ALL.forEach((q, i) => { v = (v << 1) | (f(q) ? 1 : 0); if (i % 4 === 3){ hex += v.toString(16); v = 0; } });
    if (ALL.length % 4){ v <<= 4 - ALL.length % 4; hex += v.toString(16); } return hex; };
  return ['RV3', S.name.replace(/[|]/g, ' '), S.stars, S.streak, S.speedBest, S.pet || '-', bits(q => S.done[q.id]), '0',
    '', UNITS.map((u, i) => S.exam[i] ?? '').join(','), MEMO.map(m => S.memo[m.id] ? 1 : 0).join('')].join('|');
}
function parseCode(txt){
  const p = String(txt).trim().split('|');
  if (p[0] !== 'RV3' || p.length < 10) throw new Error('bad');
  const hexBits = hx => ALL.map((q, i) => (parseInt(hx[i >> 2] || '0', 16) >> (3 - (i & 3))) & 1);
  const o = {name:p[1], stars:p[2], streak:p[3], speedBest:p[4], pet:p[5] === '-' ? '' : p[5], done:{}, mistakes:{}, best:{}, exam:{}};
  hexBits(p[6]).forEach((b, i) => { if (b) o.done[ALL[i].id] = 1; }); hexBits(p[7]).forEach((b, i) => { if (b) o.mistakes[ALL[i].id] = 1; });
  p[8].split(',').forEach((v, i) => { if (v !== '' && i < UNITS.length) o.best['unit' + i] = v; });
  p[9].split(',').forEach((v, i) => { if (v !== '' && i < UNITS.length) o.exam[i] = v; });
  o.memo = {}; (p[10] || '').split('').forEach((c, i) => { if (c === '1' && MEMO[i]) o.memo[MEMO[i].id] = 1; });
  return mergeState(o);
}
function importCode(txt){          // merge: never lowers progress
  const n = parseCode(txt);
  S.stars = Math.max(S.stars, n.stars); S.streak = Math.max(S.streak, n.streak); S.speedBest = Math.max(S.speedBest, n.speedBest);
  if (!S.name && n.name) S.name = n.name; if (n.pet && !S.pet) S.pet = n.pet;
  for (const id in n.done) S.done[id] = 1;
  for (const id in n.mistakes) if (!S.done[id]) S.mistakes[id] = 1;
  for (const k in n.best) S.best[k] = Math.max(S.best[k] || 0, n.best[k]);
  for (const k in n.exam) S.exam[k] = Math.max(S.exam[k] || 0, n.exam[k]);
  for (const k in n.memo) S.memo[k] = 1;
  saveState();
}

/* ---- read: sentence / syllable grid / lines (nasheed, story). Complete when everything has been touched ---- */
W.read = (box, q, api) => {
  const units = [], seen = new Set(); let done = false;
  const mark = i => { if (i < 0 || units[i] == null) return; seen.add(i); units[i].el.classList.add('seen'); if (seen.size === units.length && !done){ done = true; Snd.play('correct'); api.submit(true); } };
  const hl = i => units.forEach((u, k) => u.el.classList.toggle('hl', k === i));
  let texts;
  if (q.tokens){
    texts = q.tokens; let n = 0;
    q.rows.forEach(len => { const row = h('div', {class:'chips'});
      for (let k = 0; k < len; k++){ const i = n++, el = h('button', {class:'chip lg', onclick:() => { Voice.speak(q.tokens[i], true); mark(i); }}, q.tokens[i]); units.push({el}); row.append(el); }
      box.append(row); });
  } else if (q.lines){
    texts = q.lines;
    q.lines.forEach((t, i) => { const el = h('button', {class:'linecard', onclick:() => { Voice.speak(t, true); mark(i); }}, t); units.push({el}); box.append(el); });
  } else {
    texts = q.s.split(/\s+/).filter(Boolean); const row = h('div', {class:'chips'});
    texts.forEach((t, i) => { const el = h('button', {class:'chip lg', onclick:() => { Voice.speak(t, true); mark(i); }}, t); units.push({el}); row.append(el); });
    box.append(h('div', {class:'board'}, row));
  }
  const bar = h('div', {class:'row3', style:{marginTop:'8px'}});
  bar.append(h('button', {class:'btn ghost', onclick:() => { if (!Voice.each(texts, i => { hl(i); mark(i); }, true)) toast('🔇 الصوت غير متاح في هذا المتصفح'); }}, q.tokens ? '▶️ اسمعها كلها' : q.lines ? '▶️ اسمع كل الأسطر' : '▶️ اسمع الجملة'));
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR && q.s) bar.append(h('button', {class:'btn ghost', onclick:() => {
    try { const r = new SR(); r.lang = 'ar-SA'; r.onresult = e => { const heard = normCmp(e.results[0][0].transcript), want = normCmp(q.s).split(' '); const hit = want.filter(w => heard.includes(w)).length;
        if (hit / want.length >= .6){ toast('👏 قرأتَ جيدًا!'); units.forEach((u, i) => mark(i)); } else toast('🎤 حاول مرة أخرى بصوت أوضح'); };
      r.onerror = () => toast('تعذّر استعمال الميكروفون'); r.start(); toast('🎤 اقرأ الآن...'); } catch(e){ toast('تعذّر استعمال الميكروفون'); } }}, '🎤 اقرأ بصوتك'));
  box.append(bar, h('p', {class:'muted center', style:{margin:'8px 0 0'}}, 'المس كل ' + (q.tokens ? 'مقطع' : q.lines ? 'سطر' : 'كلمة') + ' لتسمعها'));
  return {reveal(){ units.forEach(u => u.el.classList.add('seen')); }, destroy(){ Voice.stop(); }};
};

/* ---- word order: build the sentence ---- */
W.wordorder = (box, q, api) => {
  const words = q.words, order = seeded(words.length, hashStr(q.id)), placed = [];
  const pool = h('div', {class:'chips'}), ans = h('div', {class:'answer', 'aria-label':'الجملة'});
  const chk = checkBtn(() => {
    const got = placed.map(i => words[i]).join(' ');
    if (got === words.join(' ')){ ans.querySelectorAll('.chip').forEach(c => c.classList.add('ok')); Voice.speak(words.join(' ')); api.submit(true); }
    else { ans.querySelectorAll('.chip').forEach((c, k) => c.classList.add(words[placed[k]] === words[k] ? 'ok' : 'bad')); shake(ans); api.submit(false); }
  });
  const render = () => {
    pool.replaceChildren(...order.filter(i => !placed.includes(i)).map(i => h('button', {class:'chip lg', onclick:() => { placed.push(i); Voice.speak(words[i], true); render(); }}, words[i])));
    ans.replaceChildren(...placed.map((i, k) => h('button', {class:'chip lg', onclick:() => { placed.splice(k, 1); render(); }}, words[i])));
    chk.disabled = placed.length !== words.length;
  };
  box.append(ans, pool, chk); render();
  return {reveal(){ placed.splice(0, placed.length, ...words.map((w, k) => k)); render(); ans.querySelectorAll('.chip').forEach(c => c.classList.add('ok')); pool.replaceChildren(); }};
};

/* ---- find the letter inside the sentence ---- */
W.find = (box, q, api) => {
  const line = h('div', {class:'findline'}), items = [];
  clusters(q.s).forEach(g => {
    if (/\s/.test(g)) return line.append(document.createTextNode(' '));
    const it = {isT:baseOf(g) === q.letter, on:false}; it.el = h('span', {class:'g', onclick:() => { it.on = !it.on; it.el.className = 'g' + (it.on ? ' on' : ''); Snd.play('pick'); }}, g); items.push(it); line.append(it.el);
  });
  const total = items.filter(i => i.isT).length;
  const chk = checkBtn(() => {
    const ok = items.every(i => i.on === i.isT);
    if (ok){ items.forEach(i => i.isT && i.el.classList.add('ok')); api.submit(true); }
    else { items.forEach(i => { if (i.on && !i.isT) i.el.className = 'g bad'; }); shake(line); api.submit(false); }
  });
  box.append(h('div', {class:'board'}, line), h('p', {class:'center muted', style:{margin:'6px 0'}}, `يظهر الحرف ${total === 1 ? 'مرة واحدة' : total === 2 ? 'مرتين' : total + ' مرات'} 🔍`), chk);
  return {reveal(){ items.forEach(i => { i.el.className = 'g' + (i.isT ? ' ok' : ''); }); }};
};

/* ---- trace the letter with the finger ---- */
W.trace = (box, q, api) => {
  const ch = q.letter, dpr = Math.min(2, devicePixelRatio || 1);
  const forms = h('div', {class:'forms'}, LETTER_FORMS(ch).map(([f, l]) => h('button', {class:'chip', 'aria-label':l, onclick:() => Voice.speak(DATA.names[ch], true)}, f, h('small', null, l))));
  const cv = h('canvas', {class:'trace', 'aria-label':'لوحة كتابة الحرف'}), msg = h('div', {class:'muted center', style:{minHeight:'1.6em',fontWeight:'700'}}, 'ضع إصبعك على الحرف وأتبع شكله');
  const bar = h('div', {class:'bar', style:{width:'100%',maxWidth:'340px'}}, h('i', {style:{width:'0%'}}));
  let ink, ictx, mask, tol, total = 0, cw, chh, down = false, last = null, inkPx = 0, finished = false, dead = false;
  const dctx = cv.getContext('2d');
  const redraw = (guideColor = 'rgba(123,31,162,.18)') => {
    dctx.clearRect(0, 0, cw, chh); dctx.font = `900 ${chh * .8}px Tajawal, sans-serif`; dctx.textAlign = 'center'; dctx.textBaseline = 'middle';
    dctx.fillStyle = guideColor; dctx.fillText(ch, cw / 2, chh * .52); dctx.drawImage(ink, 0, 0);
  };
  function init(){
    if (dead) return; const r = cv.getBoundingClientRect(); cw = Math.round(r.width * dpr); chh = Math.round(r.height * dpr); cv.width = cw; cv.height = chh;
    ink = document.createElement('canvas'); ink.width = cw; ink.height = chh; ictx = ink.getContext('2d'); ictx.lineCap = ictx.lineJoin = 'round'; ictx.lineWidth = 24 * dpr; ictx.strokeStyle = '#7B1FA2';
    const g = document.createElement('canvas'); g.width = cw; g.height = chh; const gx = g.getContext('2d', {willReadFrequently:true});
    gx.font = `900 ${chh * .8}px Tajawal, sans-serif`; gx.textAlign = 'center'; gx.textBaseline = 'middle'; gx.fillStyle = '#000'; gx.fillText(ch, cw / 2, chh * .52);
    const d = gx.getImageData(0, 0, cw, chh).data; mask = new Uint8Array(cw * chh); total = 0; const pts = [];
    for (let i = 0; i < mask.length; i++) if (d[i * 4 + 3] > 80){ mask[i] = 1; total++; }
    for (let y = 4; y < chh; y += 10) for (let x = 4; x < cw; x += 10) if (mask[y * cw + x]) pts.push([x / dpr, y / dpr]);
    gx.clearRect(0, 0, cw, chh); gx.lineWidth = 40 * dpr; gx.lineJoin = 'round'; gx.strokeStyle = '#000'; gx.strokeText(ch, cw / 2, chh * .52); gx.fillText(ch, cw / 2, chh * .52);
    const d2 = gx.getImageData(0, 0, cw, chh).data; tol = new Uint8Array(cw * chh); for (let i = 0; i < tol.length; i++) if (d2[i * 4 + 3] > 80) tol[i] = 1;
    window.__trace = {pts, w:r.width, h:r.height}; redraw();
  }
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cw / r.width, (e.clientY - r.top) * chh / r.height]; };
  function measure(){
    const d = ictx.getImageData(0, 0, cw, chh).data; let cov = 0, out = 0, ink_ = 0;
    for (let i = 0; i < mask.length; i++){ if (d[i * 4 + 3] > 60){ ink_++; if (!tol[i]) out++; if (mask[i]) cov++; } }
    return {cov:cov / Math.max(1, total), out:out / Math.max(1, ink_), ink:ink_};
  }
  function judge(){
    if (finished) return; const m = measure(); bar.firstChild.style.width = Math.min(100, m.cov * 100 / .6) + '%';
    if (m.cov >= .6 && m.out <= .3){ finished = true; msg.textContent = '👏 رسمتَ الحرف بشكل جميل!'; redraw('rgba(67,160,71,.35)'); Voice.speak(DATA.names[ch]); api.submit(true); }
    else if (m.cov >= .6 && m.out > .3){ msg.textContent = '✏️ حاول أن تبقى فوق الخط'; shake(cv); clear(); api.submit(false); }
    else msg.textContent = 'أكمل الرسم فوق كل الحرف ✏️';
  }
  function clear(){ if (!ictx) return; ictx.clearRect(0, 0, cw, chh); bar.firstChild.style.width = '0%'; redraw(); }
  cv.addEventListener('pointerdown', e => { if (!ictx || finished) return; cv.setPointerCapture(e.pointerId); down = true; last = pos(e); ictx.beginPath(); ictx.arc(last[0], last[1], ictx.lineWidth / 2, 0, 7); ictx.fillStyle = '#7B1FA2'; ictx.fill(); redraw(); });
  cv.addEventListener('pointermove', e => { if (!down) return; const p = pos(e); ictx.beginPath(); ictx.moveTo(last[0], last[1]); ictx.lineTo(p[0], p[1]); ictx.stroke(); last = p; redraw(); });
  ['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, () => { if (!down) return; down = false; judge(); }));
  box.append(h('div', {class:'tracewrap'}, forms, cv, bar, msg, h('button', {class:'btn ghost', onclick:clear}, '🧽 امسح وأعد')));
  const start = () => requestAnimationFrame(init); (document.fonts && document.fonts.load ? document.fonts.load('900 100px Tajawal', ch).then(start, start) : start());
  return {reveal(){ finished = true; if (ictx) redraw('rgba(67,160,71,.5)'); }, destroy(){ dead = true; window.__trace = null; }};
};

/* ---- pick all that belong ---- */

  const sel = new Set(), okSet = new Set(q.ok), els = [], list = h('div', {class:'chips'});
  q.items.forEach((t, i) => { const el = h('button', {class:'chip lg', onclick:() => { sel.has(i) ? sel.delete(i) : sel.add(i); el.classList.toggle('on', sel.has(i)); Voice.speak(t, true); }}, t); els.push(el); list.append(el); });
  const chk = checkBtn(() => {
    const ok = sel.size === okSet.size && [...sel].every(i => okSet.has(i));
    if (ok){ els.forEach((e, i) => e.classList.toggle('ok', okSet.has(i))); api.submit(true); }
    else { els.forEach((e, i) => { e.classList.remove('on'); if (sel.has(i) && !okSet.has(i)) e.classList.add('bad'); }); sel.clear(); setTimeout(() => els.forEach(e => e.classList.remove('bad')), 900); shake(list); api.submit(false); }

};

/* ---- build the word from its letters ---- */
W.build = (box, q, api) => {
  const gs = clusters(q.word).filter(g => g.trim()), order = seeded(gs.length, hashStr(q.id)), placed = [];
  const pool = h('div', {class:'chips'}), ans = h('div', {class:'answer'}), shown = h('span', {class:'word', dir:'rtl'});
  const chk = checkBtn(() => {
    const ok = placed.every((i, k) => baseOf(gs[i]) === baseOf(gs[k]));
    if (ok){ shown.style.color = 'var(--ok)'; Voice.speak(q.word); api.submit(true); } else { shake(ans); placed.length = 0; render(); api.submit(false); }
  });
  const render = () => {
    pool.replaceChildren(...order.filter(i => !placed.includes(i)).map(i => h('button', {class:'chip lg', onclick:() => { placed.push(i); Voice.speak(baseOf(gs[i]), true); render(); }}, gs[i])));
    shown.textContent = placed.map(i => gs[i]).join(''); ans.replaceChildren(shown); chk.disabled = placed.length !== gs.length;
  };
  box.append(...(q.pic ? [h('div', {class:'scene'}, q.pic)] : []), h('button', {class:'btn ghost', onclick:() => Voice.speak(q.word, true)}, '🔊 اسمع الكلمة'), ans, pool, h('button', {class:'linkbtn', onclick:() => { placed.pop(); render(); }}, '↩️ تراجع'), chk);
  render();
  return {reveal(){ shown.textContent = q.word; shown.style.color = 'var(--ok)'; pool.replaceChildren(); }};
};

/* ---- type with the Arabic keyboard (copy / dictation) ---- */
const KB_ROWS = ['ضصثقفغعهخحجد', 'شسيبلاتنمكطذ', 'ئءؤرىةوزظ'];
W.type = (box, q, api) => {
  let val = ''; const typed = h('div', {class:'typed', dir:'rtl', 'aria-live':'polite'}), want = normCmp(q.text);
  const upd = () => { typed.textContent = val; };
  const add = c => { if (val.length < q.text.length + 8){ val += c; upd(); } };
  const keys = KB_ROWS.map(r => h('div', {class:'kr'}, [...r].map(c => h('button', {onclick:() => { Snd.play('tap'); add(c); }}, c))));
  keys.push(h('div', {class:'kr'}, [h('button', {class:'act', 'aria-label':'مسح', onclick:() => { val = val.slice(0, -1); upd(); }}, '⌫'), ...[...'أإآ'].map(c => h('button', {onclick:() => add(c)}, c)),
    h('button', {class:'wide', 'aria-label':'مسافة', onclick:() => add(' ')}, '␣'), h('button', {onclick:() => add('.')}, '.'), h('button', {onclick:() => add('،')}, '،')]));
  const chk = checkBtn(() => {
    if (normCmp(val) === want){ typed.classList.add('ok'); Voice.speak(q.text); api.submit(true); }
    else { typed.classList.add('bad'); shake(typed); setTimeout(() => typed.classList.remove('bad'), 800); api.submit(false); }
  });
  const kh = e => { if (e.target.matches && e.target.matches('button')) return; if (/^[ء-ي]$/.test(e.key)){ add(e.key); } else if (e.key === 'Backspace'){ val = val.slice(0, -1); upd(); } else if (e.key === ' '){ e.preventDefault(); add(' '); } else if (e.key === 'Enter'){ chk.click(); } };
  document.addEventListener('keydown', kh);
  box.append(q.mode === 'copy' ? h('div', {class:'notebook'}, q.text) : h('button', {class:'btn', onclick:() => Voice.speak(q.text, true)}, '🔊 اسمع الكلمة'), typed, h('div', {class:'kb'}, keys), chk);
  return {reveal(){ val = q.text; upd(); typed.classList.add('ok'); }, destroy(){ document.removeEventListener('keydown', kh); }};
};

/* ---- memorise: listen → complete → order ---- */
W.memo = (box, q, api) => {
  const lines = q.lines, body = h('div'); let stage = 0, mistakes = 0, k2 = 0, dead = false; box.append(body);
  const wordsOf = l => l.split(/\s+/).filter(Boolean);
  const hiddenIdx = l => { const ws = wordsOf(l); let best = 0; ws.forEach((w, i) => { if (norm(w).length > norm(ws[best]).length) best = i; }); return best; };
  const finish = () => {
    S.memo[q.id] = 1; saveState(); body.replaceChildren(h('div', {class:'board'}, lines.map(l => h('div', null, l))), h('p', {class:'center', style:{fontWeight:'900',color:'var(--ok)'}}, '🌟 ما شاء الله! حفظتَ ' + q.title));
    confetti(); for (let i = 0; i < Math.min(mistakes, 2); i++) api.submit(false); api.submit(true);
  };
  const wrong = el => { mistakes++; Snd.play('wrong'); el && (el.classList.add('bad'), shake(el)); };
  const title = n => h('div', {class:'stage'}, ['١) أستمع وأقرأ', '٢) أُكمِل الكلمة الناقصة', '٣) أُرتِّب'][n] + (q.ref ? '  •  ' + q.ref : ''));
  function s1(){
    const seen = new Set(), nxt = h('button', {class:'btn', disabled:true, onclick:() => { stage = 1; s2(); }}, 'التالي ➡️');
    body.replaceChildren(title(0), ...lines.map((l, i) => h('button', {class:'linecard', onclick:e => { Voice.speak(l, true); seen.add(i); e.currentTarget.classList.add('seen'); nxt.disabled = seen.size < lines.length; }}, l)),
      h('div', {class:'row3'}, h('button', {class:'btn ghost', onclick:() => Voice.each(lines, () => {}, true)}, '▶️ اسمعها كلها'), nxt));
  }
  function s2(){
    if (k2 >= lines.length){ stage = 2; return s3(); }
    const l = lines[k2], ws = wordsOf(l), hi = hiddenIdx(l), ans = ws[hi];
    const pool = [...new Set(lines.flatMap(wordsOf).filter(w => norm(w) !== norm(ans)))]; const fall = ['الْكِتَابُ', 'الشَّمْسُ', 'الْوَلَدُ', 'رَبِّي']; fall.forEach(w => pool.length < 3 && pool.push(w));
    const opts = seeded(3, hashStr(q.id + k2)).map(i => [ans, ...shuf(pool).slice(0, 2)][i]);
    const shownLine = ws.map((w, i) => i === hi ? '＿＿＿＿' : w).join(' ');
    box.dataset.answer = ans;
    body.replaceChildren(title(1), h('div', {class:'board'}, shownLine), h('div', {class:'chips'}, opts.map(o => h('button', {class:'chip lg', onclick:e => {
      if (o === ans){ Snd.play('pick'); Voice.speak(l, true); k2++; s2(); } else wrong(e.currentTarget); }}, o))), h('p', {class:'muted center'}, `${fr(k2 + 1, lines.length)}`));
  }
  function s3(){
    const multi = lines.length > 1, units = multi ? lines : wordsOf(lines[0]);
    if (units.length < 3) return finish();
    const order = seeded(units.length, hashStr(q.id + 's3')), placed = []; box.dataset.answer = '';
    const pool = h('div', {class:multi ? '' : 'chips'}), ans = h('div', {class:'answer', style:multi ? {flexDirection:'column'} : {}});
    const render = () => {
      pool.replaceChildren(...order.filter(i => !placed.includes(i)).map(i => h('button', {class:multi ? 'linecard' : 'chip lg', onclick:e => {
        if (units[i] === units[placed.length] || norm(units[i]) === norm(units[placed.length])){ placed.push(i); Voice.speak(units[i], true); render(); } else wrong(e.currentTarget); }}, units[i])));
      ans.replaceChildren(...placed.map(i => h(multi ? 'div' : 'span', {class:multi ? 'linecard seen' : 'chip lg ok'}, units[i])));
      if (placed.length === units.length) setTimeout(() => !dead && finish(), 250);
    };
    body.replaceChildren(title(2), h('p', {class:'center muted', style:{margin:'0 0 6px'}}, multi ? 'المس الأسطر بالترتيب الصحيح' : 'المس الكلمات بالترتيب الصحيح'), ans, pool); render();
  }
  s1();
  return {reveal(){ body.replaceChildren(h('div', {class:'board'}, lines.map(l => h('div', null, l)))); }, destroy(){ dead = true; Voice.stop(); }};
};

/* ---- writing: fill the missing word / free sentence (typed on the Arabic keyboard) ---- */

function viewStudio(){
  const cv = h('canvas', {'aria-label':'لوحة الرسم'}); let strokes = loadDrawing(), cur = null, color = '#E53935', size = 8, eraser = false;
  const cols = ['#E53935','#FB8C00','#FDD835','#43A047','#1E88E5','#8E24AA','#EC407A','#6D4C41','#000000'];
  const swEl = h('div', {class:'swatches'}), eraserBtn = h('button', {class:'cchip', onclick:() => { eraser = !eraser; paintUI(); }}, '🧽 ممحاة');
  function paintUI(){ swEl.replaceChildren(...cols.map(c => h('button', {class:'sw' + (!eraser && c === color ? ' on' : ''), style:{background:c}, 'aria-label':'لون', onclick:() => { color = c; eraser = false; paintUI(); }})), eraserBtn); eraserBtn.classList.toggle('on', eraser); }
  function redraw(){
    const d = devicePixelRatio || 1, cx = cv.getContext('2d'); cx.setTransform(d, 0, 0, d, 0, 0); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
    strokes.forEach(s => { cx.strokeStyle = s.c; cx.fillStyle = s.c; cx.lineWidth = s.w; cx.lineCap = cx.lineJoin = 'round';
      if (s.p.length === 1){ cx.beginPath(); cx.arc(s.p[0][0], s.p[0][1], s.w / 2, 0, 7); cx.fill(); } else { cx.beginPath(); s.p.forEach((pt, i) => i ? cx.lineTo(pt[0], pt[1]) : cx.moveTo(pt[0], pt[1])); cx.stroke(); } });

  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); cur = {c:eraser ? '#fff' : color, w:eraser ? size * 2.5 : size, p:[pos(e)]}; strokes.push(cur); redraw(); });
  cv.addEventListener('pointermove', e => { if (cur){ cur.p.push(pos(e)); redraw(); } });

  addEventListener('resize', fit); onLeave(() => removeEventListener('resize', fit));

const DRAW_KEY = 'kitabi.ar.drawing';
function loadDrawing(){
  try {
    const a = JSON.parse(localStorage.getItem(DRAW_KEY) || '[]'); if (!Array.isArray(a)) return [];
    const out = a.slice(0, 400).filter(s => s && Array.isArray(s.p) && /^#[0-9a-f]{3,6}$/i.test(s.c) && s.p.length < 3000)
      .map(s => ({c:s.c, w:Math.min(80, Math.max(1, +s.w || 8)), p:s.p.map(pt => [+pt[0] || 0, +pt[1] || 0])}));
    out._norm = out.length > 0; return out;
  } catch(e){ return []; }
}
function saveDrawing(strokes, cv){
  try {
    const r = cv.getBoundingClientRect(); if (!r.width || !r.height) return;
    const s = JSON.stringify(strokes.map(k => ({c:k.c, w:k.w, p:k.p.map(([x, y]) => [+(x / r.width).toFixed(4), +(y / r.height).toFixed(4)])})));
    if (s.length < 900000) localStorage.setItem(DRAW_KEY, s);
  } catch(e){}
}

/* --- leaderboard --- */
let BOARD_SCOPE = 'local', BOARD_METRIC = 'w';
function viewBoard(){
  const body = h('div'), status = h('p', {class:'muted center', style:{margin:'6px 0'}});
  const render = list => {
    const ranked = rankList(list, BOARD_METRIC), meIdx = ranked.findIndex(e => e.me), me = ranked[meIdx];
    const val = e => BOARD_METRIC === 'w' ? e.w : e.s;
    const pod = ranked.slice(0, 3), order = [pod[1], pod[0], pod[2]].filter(Boolean), H = {0:'140px', 1:'110px', 2:'90px'};
    let msg = '';
    if (me && ranked.length > 1){ if (meIdx === 0) msg = `🥇 أنت الأول! تتقدّم بـ ⭐${val(me) - val(ranked[1])} — حافظ على الصدارة!`; else msg = `💪 يفصلك ⭐${Math.max(1, val(ranked[meIdx - 1]) - val(me) + 1)} عن ${ranked[meIdx - 1].n} — هيا حلّ تمرينًا!`; }
    else if (ranked.length <= 1) msg = '👋 أضف أصدقاء إلى المنافسة ليظهروا هنا!';
    body.replaceChildren(
      msg ? h('div', {class:'goal', style:{textAlign:'center',fontWeight:'900'}}, msg) : null,
      ranked.length ? h('div', {class:'podium'}, order.map(e => { const r = ranked.indexOf(e); return h('div', {class:'pcol' + (e.me ? ' me' : '')}, h('div', {class:'pav big'}, e.a), h('b', null, e.n), h('small', null, `⭐ ${val(e)}`), h('div', {class:'pstep r' + r, style:{height:H[r]}}, ['🥇', '🥈', '🥉'][r])); })) : null,
      h('div', {class:'card', style:{padding:'6px'}}, ranked.length ? ranked.map((e, i) => h('div', {class:'brow' + (e.me ? ' me' : '')}, h('span', {class:'rk'}, i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1), h('span', {class:'pav'}, e.a),
        h('span', {class:'grow'}, h('b', null, e.n + (e.me ? ' (أنا)' : '')), h('small', null, `✅ ${e.d} • ✍️ ${e.wr} • 🔥 ${e.k} • 🕌 ${e.m}${e.x ? ' • 🏫 ' + e.x + '%' : ''}`)), h('span', {class:'sc'}, '⭐ ' + val(e)))) : h('p', {class:'muted center'}, 'لا يوجد أبطال بعد.')));
  };
  async function load(){
    if (BOARD_SCOPE === 'local'){ status.textContent = ''; return render(localBoard()); }
    if (!online()){ status.textContent = ''; return render([]); }
    status.textContent = '⏳ جارٍ التحميل…'; render(cachedOnline());
    await pushMine();
    try { const l = await fetchOnline(); render(l); status.textContent = `🌐 صف «${CFG.room}» • آخر تحديث ${new Date().toLocaleTimeString('ar-DZ', {hour:'2-digit', minute:'2-digit'})}${S.share ? '' : ' • أنت لا تظهر للآخرين (فعّل المشاركة من ركن الأهل)'}`; }
    catch(e){ status.textContent = '📴 تعذّر الاتصال — تظهر آخر نتائج محفوظة'; }
  }
  const tabs = h('div', {class:'tabs'}), per = h('div', {class:'tabs'});
  const drawTabs = () => {
    tabs.replaceChildren(h('button', {class:BOARD_SCOPE === 'local' ? 'on' : '', onclick:() => { BOARD_SCOPE = 'local'; drawTabs(); load(); }}, '👥 على هذا الجهاز'), h('button', {class:BOARD_SCOPE === 'net' ? 'on' : '', onclick:() => { BOARD_SCOPE = 'net'; drawTabs(); load(); }}, '🌐 الصف (إنترنت)'));
    per.replaceChildren(h('button', {class:BOARD_METRIC === 'w' ? 'on' : '', onclick:() => { BOARD_METRIC = 'w'; drawTabs(); load(); }}, '📅 هذا الأسبوع'), h('button', {class:BOARD_METRIC === 's' ? 'on' : '', onclick:() => { BOARD_METRIC = 's'; drawTabs(); load(); }}, '⭐ كل الوقت'));
  };
  drawTabs();
  const setup = !online() && BOARD_SCOPE === 'net' ? h('div', {class:'card'}, h('p', {style:{margin:'0 0 8px',fontWeight:'700'}}, '🌐 لم تُفعَّل المنافسة عبر الإنترنت بعد. يحتاج ولي الأمر إلى ربط قاعدة بيانات مجانية مرة واحدة.'), h('button', {class:'btn', onclick:() => go('boardsetup')}, '⚙️ تفعيل (للأهل)')) : null;
  app.append(topbar('🏆 لوحة الأبطال', '#F57C00', h('button', {class:'iconbtn', 'aria-label':'تحديث', onclick:load}, '🔄')), h('div', {class:'pad'}, tabs, per, setup, body, status,
    h('div', {class:'row', style:{justifyContent:'center',flexWrap:'wrap'}}, h('button', {class:'btn ghost', onclick:() => go('profiles')}, '👥 تبديل الطفل'), h('button', {class:'btn ghost', onclick:() => go('boardsetup')}, '⚙️ إعداد المنافسة'))));
  load();
  clearInterval(boardTimer); cleanup = () => clearInterval(boardTimer);
  boardTimer = setInterval(() => { if (BOARD_SCOPE === 'net' && online() && !document.hidden) load(); }, 25000);
}

  const url = h('input', {class:'field', type:'url', dir:'ltr', placeholder:'https://اسم-مشروعك-default-rtdb.firebaseio.com', value:CFG.url, style:{width:'100%'}});
  const room = h('input', {class:'field', type:'text', dir:'ltr', maxLength:24, placeholder:'CLASS-1A', value:CFG.room, style:{width:'100%'}});
  const msg = h('p', {class:'muted', style:{minHeight:'1.4em'}}), shares = [];
  const save = () => { CFG = {url:url.value.trim().replace(/\/+$/, ''), room:room.value.trim()}; lsSet(CFG_KEY, CFG); };
  const test = async () => { save(); if (!okUrl(CFG.url)) return msg.textContent = '⚠️ الرابط غير صالح (يجب أن يبدأ بـ https://)'; if (!okRoom(CFG.room)) return msg.textContent = '⚠️ رمز الصف: 3–24 حرفًا لاتينيًا أو أرقامًا أو - _';

  const profs = PROF.list.map(p => { const s = readProfileState(p.id); if (!s) return null; const cb = h('input', {type:'checkbox', checked:!!s.share, onchange:() => { if (p.id === PROF.cur){ S.share = cb.checked; saveState(); } else { const raw = lsGet(keyFor(p.id)) || {}; raw.share = cb.checked; if (!raw.uid) raw.uid = newUid(); lsSet(keyFor(p.id), raw); } if (cb.checked && p.id === PROF.cur) pushMine(); }});
    return h('label', {class:'checkl'}, cb, h('span', {class:'grow'}, `${s.avatar} ${s.name || 'بطل'}`)); }).filter(Boolean);
  app.append(topbar('⚙️ المنافسة عبر الإنترنت', '#546E7A', null), h('div', {class:'pad'},
    h('div', {class:'card'}, h('div', {class:'h2', style:{margin:'0 0 6px'}}, '١) رابط قاعدة البيانات'), url, h('div', {class:'h2', style:{margin:'10px 0 6px'}}, '٢) رمز الصف (يتفق عليه الأصدقاء)'), room,
      h('div', {class:'row', style:{marginTop:'10px'}}, h('button', {class:'btn', onclick:test}, '🔌 حفظ واختبار'), h('button', {class:'btn ghost', onclick:() => { CFG = {url:'', room:''}; lsSet(CFG_KEY, CFG); url.value = room.value = ''; msg.textContent = 'تم إيقاف الاتصال'; }}, 'إيقاف')), msg),
    h('div', {class:'card'}, h('div', {class:'h2', style:{margin:'0 0 6px'}}, '٣) من يظهر للآخرين؟'), ...profs, h('p', {class:'muted', style:{margin:'6px 0 0'}}, 'يُرسَل فقط: الاسم المستعار، الصورة الرمزية، النجوم والإنجازات. لا تُرسَل جمل الطفل ولا أي معلومات شخصية. استعملوا اسمًا مستعارًا.')),
    h('div', {class:'card'}, h('div', {class:'h2', style:{margin:'0 0 6px'}}, 'كيف أنشئ قاعدة مجانية؟ (5 دقائق)'),
      h('ol', {style:{margin:'0',paddingInlineStart:'20px',lineHeight:'1.9'}}, ['ادخل إلى console.firebase.google.com بحساب Google وأنشئ مشروعًا.', 'من القائمة اختر Build ← Realtime Database ← Create Database.', 'اختر «Start in test mode» (أو الصق القواعد أدناه في تبويب Rules).', 'انسخ الرابط الظاهر أعلى الصفحة (ينتهي بـ firebaseio.com أو firebasedatabase.app) والصقه هنا.', 'اكتب الرمز نفسه عند كل الأصدقاء، وفعّل المشاركة لكل طفل.'].map(t => h('li', null, t))),
      h('pre', {class:'code', dir:'ltr'}, '{ "rules": { "kitabi": { "$room": { "$uid": { ".read": true, ".write": true } } } } }'),
      h('p', {class:'muted', style:{margin:'6px 0 0'}}, '⚠️ أي شخص يعرف رابط القاعدة ورمز الصف يمكنه رؤية الترتيب أو تغيير نتيجة. هذا مناسب لصف أو عائلة، لا لمنافسة عامة.'))));
}
